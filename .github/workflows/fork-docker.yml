name: Fork Docker image

# The image of this fork: ghcr.io/<owner>/it-tools, tagged latest and YYYY.MM.DD-<sha>.
# It is published after ci passes on a push to main, and rebuilt every Monday so that the
# nginx and node base images pick up their security fixes. Upstream's Docker workflows push
# to sharevb's registries and were removed from the fork (commit 1771dc20).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  # One publish at a time, newest wins, so an older run never overwrites the tags.
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    # A pull request's ci run must never publish.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit ci tested; main for the weekly and manual runs.
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}

      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/it-tools"
          version="$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)"
          {
            echo "image=$image"
            echo "version=$version"
            echo "tags=$image:latest,$image:$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: it-tools-fork:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          # As it runs on the server: read-only, /tmp in tmpfs; once from /, once from a subpath.
          # A subpath needs a writable /etc/nginx/conf.d, where the entrypoint renders the config,
          # owned by the nginx user (101): a plain tmpfs keeps root's mode and stays read-only.
          docker run -d --name root --read-only --tmpfs /tmp -p 127.0.0.1:8081:8080 it-tools-fork:test
          docker run -d --name subpath --read-only --tmpfs /tmp --tmpfs /etc/nginx/conf.d:uid=101,gid=101 \
            -e BASE_URL=/it-tools/ -p 127.0.0.1:8082:8080 it-tools-fork:test
          for port in 8081 8082; do
            for _ in $(seq 30); do curl -fs -o /dev/null "http://127.0.0.1:$port/" && break; sleep 1; done
          done
          sh scripts/fork/smoke.sh http://127.0.0.1:8081/
          sh scripts/fork/smoke.sh http://127.0.0.1:8082/it-tools/

      - name: Container logs
        if: failure()
        run: docker logs root; docker logs subpath

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # The Dockerfile labels point at sharevb; these link the package to this repository.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
