tools:
  image-editor:
    title: 'Редактор картинок'
    description: 'Редактирует картинку в браузере: обрезка, поворот и отражение, яркость, контраст и другие настройки, фильтры, текст, фигуры, рисование, водяной знак и новый размер.'
    texts:
      drop: 'Перетащите сюда картинку или нажмите, чтобы выбрать'
      loading: 'Загрузка редактора...'
      close: 'Открыть другую картинку'
      default-text: 'Текст'
      hint: 'Картинка не покидает браузер. Кнопка «Сохранить» скачивает результат: там же выбираются имя, формат и качество.'
