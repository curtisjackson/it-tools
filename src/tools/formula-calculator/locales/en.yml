tools:
  formula-calculator:
    title: 'Formula calculator'
    description: "Solve a formula for any of its variables: Ohm's law, voltage drop in a cable, area and volume of a sphere, slackline tension, or your own formula. Units are converted."
    texts:
      label-calculator: 'Calculator'
      calc-ohms-law: "Ohm's law"
      calc-voltage-drop: 'Voltage drop in a cable'
      calc-sphere-area: 'Surface area of a sphere'
      calc-sphere-volume: 'Volume of a sphere'
      calc-slackline: 'Slackline tension'
      calc-custom: 'Your own formula'
      about-ohms-law: 'V = I × R: any of voltage, current and resistance from the other two, and the power.'
      about-voltage-drop: 'Round trip voltage drop and power loss in a two conductor cable: the current goes through the cable and back. Resistivity at 20 °C.'
      about-sphere-area: 'A = 4πr²: the surface area from the radius or the diameter, or back.'
      about-sphere-volume: 'V = 4/3 πr³: the volume from the radius or the diameter, or back.'
      about-slackline: 'Tension of a line with a load in its middle. An approximation: do not rely on it for safety.'
      about-custom: 'Type a formula with one "=", such as "F = m * a" or "x^2 + 2x = 8": every other name in it is a variable. Constants: pi, e. Functions: sqrt, sin, log, exp and the other functions of mathjs.'
