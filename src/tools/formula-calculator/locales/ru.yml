tools:
  formula-calculator:
    title: 'Калькулятор по формулам'
    description: 'Решает формулу относительно любой её переменной: закон Ома, падение напряжения в кабеле, площадь и объём шара, натяжение слэклайна или своя формула. Единицы переводятся.'
