tools:
  pdf-to-epub:
    title: 'PDF to EPUB'
    description: 'Turn the text of a PDF into an EPUB e-book, one chapter per page.'
    texts:
      drop: 'Drag and drop a PDF here, or click to select one'
      label-title: 'Book title'
      placeholder-title: 'From the PDF'
