tools:
  pdf-editor:
    title: 'Редактор PDF'
    description: 'Просмотр и пометки в PDF прямо в браузере: выделение и комментарии, рисование, текст, фигуры, картинки и штампы, подпись, заполнение форм, закрашивание, затем скачивание результата.'
    texts:
      drop: 'Перетащите сюда PDF или нажмите, чтобы выбрать'
      close: 'Открыть другой PDF'
      hint: 'Документ не покидает браузер. Изменённый PDF скачивается из меню документа (☰ → Скачать).'
