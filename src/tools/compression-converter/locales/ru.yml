tools:
  compression-converter:
    title: 'Сжатие и распаковка'
    description: 'Сжимает и распаковывает текст или файлы алгоритмами LZ4, LZMA, Bzip2 и lz-string.'
    texts:
      label-algorithm: 'Алгоритм'
      algorithm-lz-string: 'LZString'
      algorithm-lz4: 'LZ4'
      algorithm-lzma: 'LZMA'
      algorithm-bzip2: 'Bzip2'
      label-mode: 'Режим'
      mode-compress: 'Сжать'
      mode-decompress: 'Распаковать'
      label-format: 'Формат'
      format-default: 'Сырой UTF-16'
      format-utf16: 'UTF-16 (для localStorage)'
      format-base64: 'Base64'
      format-uri: 'Для ссылок (EncodedURIComponent)'
      label-level: 'Уровень'
      label-block-size: 'Размер блока'
      block-size: '{0}00 КБ'
      label-work-factor: 'Work factor'
      hint-lz-string: 'lz-string сжимает текст в текст. Веб-приложения так хранят данные в localStorage или в ссылке.'
      hint-lz4: 'Сжатие пишет кадр LZ4, как CyberChef. Распаковка читает всё, что пишет утилита lz4: несколько кадров подряд, старый формат и контрольные суммы, которые проверяются.'
      hint-lzma: 'Формат .lzma утилиты lzma, xz --format=lzma и 7-Zip. Уровень 1 — самый быстрый, 9 сжимает сильнее всего, 6 — как в утилите lzma. Формат .xz не поддерживается.'
      hint-bzip2: 'Сжатие идёт через libbzip2, поэтому результат такой же, как у утилиты bzip2. Чем больше блок, тем сильнее сжатие. Work factor задаёт, сколько bzip2 бьётся над очень повторяющимися данными, прежде чем перейти на медленный способ: от 0 до 250, 0 значит 30. Распаковка читает все потоки файла, как их пишет pbzip2, и проверяет CRC.'
      label-input: 'Вход'
      placeholder-text: 'Ваш текст...'
      placeholder-compressed: 'Сжатая строка...'
      detected-lz4: 'Похоже на данные LZ4.'
      detected-lzma: 'Похоже на данные LZMA.'
      detected-bzip2: 'Похоже на данные Bzip2.'
      detected-gzip: 'Похоже на gzip: откройте «Конвертер GZip/Deflate».'
      detected-xz: 'Похоже на файл .xz, его эта утилита не читает.'
      switch: 'Переключить на {0}'
      title-result: 'Результат'
      sizes: '{0} → {1} ({2})'
      download: 'Скачать'
      label-output-format: 'Показать как'
      too-large: 'Результат слишком большой, чтобы показать его здесь. Скачайте его.'
      hint-raw-output: 'В этом формате встречаются любые символы Unicode, и при копировании через буфер обмена они могут испортиться. Чтобы переносить данные, выберите Base64 или формат для ссылок.'
      empty: 'Введите данные, чтобы увидеть результат.'
