      detected-xz: 'This looks like an .xz file, which this tool cannot read.'
      switch: 'Switch to {0}'
      title-result: 'Result'
      sizes: '{0} → {1} ({2})'
      download: 'Download'
      label-output-format: 'Show as'
      too-large: 'The result is too large to show here. Download it instead.'
      hint-raw-output: 'This format uses arbitrary Unicode characters, and copying through the clipboard can damage them. To move the data around, use Base64 or the URL-safe format.'
