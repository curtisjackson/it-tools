tools:
  compression-converter:
    title: 'Compression converter'
    description: 'Compress and decompress text or files with LZ4, LZMA or lz-string.'
    texts:
      label-algorithm: 'Algorithm'
      algorithm-lz-string: 'LZString'
      algorithm-lz4: 'LZ4'
      algorithm-lzma: 'LZMA'
      label-mode: 'Mode'
      mode-compress: 'Compress'
      mode-decompress: 'Decompress'
      label-format: 'Format'
      format-default: 'Raw UTF-16'
      format-utf16: 'UTF-16 (for localStorage)'
      format-base64: 'Base64'
      format-uri: 'URL-safe (EncodedURIComponent)'
