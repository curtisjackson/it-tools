tools:
  video-trim:
    title: Обрезка видео
    description: Вырезает из видео фрагмент по времени прямо в браузере.
    texts:
      label-mode: Режим
      mode-fast: Быстро
      mode-precise: Покадрово
      mode-fast-hint: Копирует потоки без перекодирования. Мгновенно и без потерь, но начало сдвигается к ближайшему ключевому кадру.
      mode-precise-hint: Перекодирует в MP4 (H.264 + AAC) и режет точно по кадру. Медленнее, особенно для длинных и HD-видео.
      button-trim: Обрезать
