tools:
  png-compressor:
    title: 'Сжатие PNG'
    description: 'Уменьшает PNG, сводя их к палитре до 256 цветов. Размеры и прозрачность сохраняются.'
    texts:
      drop-pngs: 'Перетащите PNG сюда или нажмите, чтобы выбрать'
      label-quality: 'Качество ({0}%)'
      label-max-size: 'Целевой размер'
      label-dithering: 'Дизеринг'
      hint: '100% — это 256 цветов. С целевым размером палитра уменьшается, пока файл не уложится; 0 — без цели. Дизеринг скрывает полосы в градиентах.'
      missed-target: 'Не удалось уложиться в целевой размер даже с двумя цветами: {0}'
      button: 'Сжать'
