      hint-tar: 'A POSIX tar, as GNU tar --format=posix writes it: long and non-ASCII names are kept. A tar is not compressed.'
      hint-tar-gz: 'A POSIX tar compressed with gzip, the usual .tar.gz or .tgz.'
      hint-aes: 'AES-256 is the safe choice. 7-Zip, WinRAR, macOS and bsdtar open it, but the unzip tool and the ZIP folders of older Windows versions cannot.'
      hint-zip-crypto: 'ZipCrypto opens everywhere, including Windows, but it is easy to break: use it only when AES does not open on the other side.'
